name: deploy docs

on:
  push:
    branches:
      - main
      - develop
      - bugfixes

permissions:
  contents: read

# One deploy pipeline at a time: a newer push supersedes an in-flight run.
# Each branch's build is cached per commit, so the restarted run only rebuilds
# whatever actually changed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            version: stable
          - branch: develop
            version: latest
          - branch: bugfixes
            version: patch
    steps:
      - name: Checkout ${{ matrix.branch }} 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Resolve branch commit
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Skip the toolchain + build entirely when this exact commit was built
      # before. Only the branch that triggered the push misses the cache.
      - name: Restore built docs
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-output
          key: docs-build-v1-${{ matrix.version }}-${{ steps.meta.outputs.sha }}

      - name: Setup pnpm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.version }} docs
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm run build --outDir build-output
        env:
          DOCS_VERSION: ${{ matrix.version }}

      - name: Upload ${{ matrix.version }} build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ matrix.version }}
          path: build-output
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: assemble
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Stable lives at the site root; latest/patch are nested previews whose
      # asset URLs already point at /latest and /patch respectively.
      - name: Download stable build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-stable
          path: dist

      - name: Download latest build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-latest
          path: dist/latest

      - name: Download patch build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-patch
          path: dist/patch

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: assemble

    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # OIDC token for the Pages deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
