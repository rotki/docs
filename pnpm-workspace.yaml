blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rotki/*'
  # Renovate security update: markdown-it@14.3.3
  - markdown-it@14.3.3

trustPolicy: no-downgrade
trustPolicyExclude:
  - vite

shellEmulator: true
strictDepBuilds: true
saveExact: true

overrides:
  vitepress>vite: npm:vite@8.3.4

allowBuilds:
  esbuild: true
